
<div class="edit-customer-page">
  <h2>Edit Customer</h2>
  <p class="description">Update the customer details below.</p>

  @if (errorMessage) {
    <p class="error-message">{{ errorMessage }}</p>
  }

  @if (successMessage) {
    <p class="success-message">{{ successMessage }}</p>
  }

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter customer name"
        [(ngModel)]="customer.name"
      >
    </div>

    <div class="form-group">
      <label for="address">Address</label>
      <textarea
        id="address"
        name="address"
        rows="3"
        placeholder="Enter customer address"
        [(ngModel)]="customer.address"
      ></textarea>
    </div>

    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="Enter phone number"
        [(ngModel)]="customer.phone"
      >
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter email address"
        [(ngModel)]="customer.email"
      >
    </div>

    <div class="form-group">
      <label for="image">Replace Profile Image (Optional)</label>
      <input
        type="file"
        id="image"
        name="image"
        accept="image/*"
        (change)="onImageSelected($event)"
      >
      <small>Choose a new image only if you want to replace the existing one.</small>
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="isSubmitting">{{ isSubmitting ? 'Updating...' : 'Update Customer' }}</button>
      <button type="button" class="cancel-button">Cancel</button>
    </div>
  </form>
</div>
